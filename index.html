<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saurabh Cyber Notepad</title>
    
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Official Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --bg-color: #02070d;
            --main-green: #00ff66;
            --soft-green: rgba(0, 255, 102, 0.65);
            --panel-bg: rgba(2, 12, 8, 0.95);
            --border-color: #00ff66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-green);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 30% 50%, #00140a 0%, #01060a 100%);
        }

        /* HUD Scanline Overlay */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            z-index: 10;
            background-size: 100% 3px;
            pointer-events: none;
        }

        header {
            border-bottom: 2px solid var(--main-green);
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            z-index: 2;
        }

        .system-title {
            font-size: 15px;
            letter-spacing: 2px;
            color: var(--main-green);
            text-shadow: 0 0 6px var(--main-green);
            font-weight: bold;
        }

        .auth-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-card {
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--main-green);
            padding: 4px 10px;
            border-radius: 4px;
        }

        .user-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid var(--main-green);
        }

        .user-name {
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid #ff3333;
            color: #ff3333;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
            border-radius: 3px;
        }

        .btn-logout:hover {
            background: #ff3333;
            color: #fff;
        }

        main {
            display: flex;
            flex: 1;
            padding: 12px;
            gap: 12px;
            height: calc(100vh - 50px);
            z-index: 2;
        }

        /* Left Panel: 3D Earth Section */
        .viewport-panel {
            flex: 0.9;
            background: var(--panel-bg);
            border: 1px solid var(--main-green);
            box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.12);
            position: relative;
            display: flex;
            flex-direction: column;
            border-radius: 4px;
            overflow: hidden;
        }

        .panel-header {
            background: rgba(0, 255, 102, 0.1);
            padding: 8px 12px;
            font-size: 11px;
            color: var(--main-green);
            border-bottom: 1px solid var(--main-green);
            letter-spacing: 1.5px;
            display: flex;
            justify-content: space-between;
        }

        .content-area-3d {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #canvas-container {
            width: 100%;
            flex: 1;
            position: relative;
            background: #010a05;
        }

        /* Video style HUD Crosshair Overlay on top of 3D Canvas */
        .hud-overlay-graphics {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hud-crosshair {
            width: 280px;
            height: 280px;
            border: 1px dashed rgba(0, 255, 102, 0.25);
            border-radius: 50%;
            position: absolute;
        }

        .hud-crosshair::before, .hud-crosshair::after {
            content: '';
            position: absolute;
            background: rgba(0, 255, 102, 0.3);
        }

        .hud-crosshair::before {
            top: 50%; left: -15px; width: 310px; height: 1px;
        }

        .hud-crosshair::after {
            left: 50%; top: -15px; height: 310px; width: 1px;
        }

        .hud-bottom-panel {
            padding: 14px 18px;
            border-top: 1px solid var(--main-green);
            background: rgba(0, 10, 5, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .clock-box {
            border: 1px solid var(--main-green);
            padding: 10px 18px;
            background: rgba(0, 255, 102, 0.05);
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.18);
            border-radius: 4px;
            text-align: center;
            width: 100%;
        }

        .clock-label {
            font-size: 11px;
            color: var(--soft-green);
            letter-spacing: 2px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .time-display {
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px var(--main-green);
            letter-spacing: 3px;
        }

        .date-display {
            font-size: 12px;
            color: var(--main-green);
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* Right Panel: Notepad Section */
        .notepad-panel {
            flex: 1.6;
            background: var(--panel-bg);
            border: 1px solid var(--main-green);
            box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.12);
            display: flex;
            flex-direction: column;
            border-radius: 4px;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: var(--main-green);
            padding: 18px;
            font-size: 16px;
            line-height: 1.6;
            resize: none;
            outline: none;
            text-shadow: 0 0 2px var(--main-green);
        }

        textarea::selection {
            background: var(--main-green);
            color: #000;
        }

        .controls {
            padding: 10px 15px;
            border-top: 1px solid var(--main-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
        }

        .btn {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--main-green);
            color: var(--main-green);
            padding: 8px 18px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1.5px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--main-green);
            color: #000;
            box-shadow: 0 0 10px var(--main-green);
        }

        .status-msg {
            font-size: 11px;
            color: var(--main-green);
        }
    </style>
</head>
<body>

    <header>
        <div class="system-title">// CYBER_OS :: SECURE NOTEBOOK</div>
        
        <div class="auth-container">
            <div id="g_id_onload"
         data-client_id="310737518157-tutlpj1g22vkhnurmpoe7j1f87rtehe0.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>
            <div class="g_id_signin" data-type="standard" data-theme="dark" data-size="medium"></div>

            <div class="user-card" id="user-card">
                <img class="user-avatar" id="user-img" src="" alt="Avatar">
                <span class="user-name" id="user-name">USER</span>
                <button class="btn-logout" onclick="logoutGoogle()">LOGOUT</button>
            </div>

            <div class="system-title" id="top-clock">00:00:00</div>
        </div>
    </header>

    <main>
        <!-- Left Side: 3D Earth Viewport with Video-style Cyber Rings -->
        <div class="viewport-panel">
            <div class="panel-header">
                <span>ORBITAL HUD // GLOBAL NETWORK MAP</span>
                <span>ONLINE</span>
            </div>
            <div class="content-area-3d">
                <div id="canvas-container">
                    <div class="hud-overlay-graphics">
                        <div class="hud-crosshair"></div>
                    </div>
                </div>

                <div class="hud-bottom-panel">
                    <div class="clock-box">
                        <div class="clock-label">> REALTIME SYSTEM CLOCK</div>
                        <div class="time-display" id="main-time">00:00:00</div>
                        <div class="date-display" id="main-date">YYYY-MM-DD</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side: Notepad Editor -->
        <div class="notepad-panel">
            <div class="panel-header">
                <span id="file-title">ENCRYPTED_NOTEBOOK.TXT</span>
                <span>MODE: LOCAL_STORAGE_ACTIVE</span>
            </div>
            <textarea id="editor" placeholder="// TYPE YOUR NOTES HERE... (AUTO-SAVED IN LOCAL STORAGE)"></textarea>
            <div class="controls">
                <span class="status-msg" id="save-status">STATUS: SYSTEM_READY</span>
                <button class="btn" onclick="downloadToDesktop()">[ SAVE TO DESKTOP ]</button>
            </div>
        </div>
    </main>

    <script>
        // Realtime Clock
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            const dateStr = now.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
            
            document.getElementById('top-clock').innerText = timeStr;
            document.getElementById('main-time').innerText = timeStr;
            document.getElementById('main-date').innerText = dateStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Editor Auto-Save & Download Setup
        const editor = document.getElementById('editor');
        const statusEl = document.getElementById('save-status');

        window.addEventListener('DOMContentLoaded', () => {
            const savedContent = localStorage.getItem('cyber_os_notes');
            if (savedContent) editor.value = savedContent;
            checkSavedUser();
        });

        editor.addEventListener('input', () => {
            localStorage.setItem('cyber_os_notes', editor.value);
            statusEl.innerText = "STATUS: AUTO_SAVED_LOCAL";
            setTimeout(() => statusEl.innerText = "STATUS: SYSTEM_READY", 2000);
        });

        function downloadToDesktop() {
            const textContent = editor.value;
            if (!textContent.trim()) {
                alert("Kripya save karne se pehle kuch notes likhein!");
                return;
            }

            const blob = new Blob([textContent], { type: "text/plain;charset=utf-8" });
            const link = document.createElement("a");
            const date = new Date().toISOString().slice(0, 10);
            link.download = `Cyber_OS_Notes_${date}.txt`;
            link.href = window.URL.createObjectURL(blob);
            link.style.display = "none";
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            statusEl.innerText = "STATUS: EXPORTED_TO_DESKTOP";
            setTimeout(() => statusEl.innerText = "STATUS: SYSTEM_READY", 3000);
        }

        // Google Authentication
        function parseJwt (token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            const userData = {
                name: responsePayload.name,
                email: responsePayload.email,
                picture: responsePayload.picture
            };
            
            localStorage.setItem('cyber_os_user', JSON.stringify(userData));
            renderUserCard(userData);
        }

        function renderUserCard(user) {
            document.querySelector('.g_id_signin').style.display = 'none';
            const userCard = document.getElementById('user-card');
            document.getElementById('user-img').src = user.picture;
            document.getElementById('user-name').innerText = user.name.toUpperCase();
            userCard.style.display = 'flex';
        }

        function checkSavedUser() {
            const user = localStorage.getItem('cyber_os_user');
            if (user) renderUserCard(JSON.parse(user));
        }

        function logoutGoogle() {
            localStorage.removeItem('cyber_os_user');
            document.getElementById('user-card').style.display = 'none';
            document.querySelector('.g_id_signin').style.display = 'block';
            statusEl.innerText = "STATUS: LOGGED_OUT";
        }

        // --- 3D Globe with Video-style Dot Mesh & HUD Rings ---
        function createVideoStyleGreenEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#010e06';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Matrix Grid
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.12)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += 24) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += 24) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // High Density Green Dot Mesh
            ctx.fillStyle = '#00ff66';
            for (let i = 0; i < 6000; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 2.2 + 0.9;
                ctx.shadowColor = '#00ff66';
                ctx.shadowBlur = 4;
                ctx.fillRect(x, y, size, size);
            }

            return new THREE.CanvasTexture(canvas);
        }

        window.addEventListener('load', () => {
            const container = document.getElementById('canvas-container');
            if (!container) return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 0, 4.75); // Exact previous camera distance

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x00ff66, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00ff66, 2.0);
            dirLight.position.set(5, 3, 5);
            scene.add(dirLight);

            // Tilted Group (23.5 Deg)
            const earthGroup = new THREE.Group();
            earthGroup.rotation.z = (23.5 * Math.PI) / 180;
            scene.add(earthGroup);

            // Earth Mesh (Same exact size: 1.48)
            const earthTexture = createVideoStyleGreenEarthTexture();
            const earthGeo = new THREE.SphereGeometry(1.48, 64, 64);
            const earthMat = new THREE.MeshStandardMaterial({
                map: earthTexture,
                roughness: 0.4,
                metalness: 0.3,
                emissive: 0x002208,
                emissiveIntensity: 0.4
            });
            const earth = new THREE.Mesh(earthGeo, earthMat);
            earthGroup.add(earth);

            // Outer Wireframe Grid
            const wireGeo = new THREE.SphereGeometry(1.488, 36, 36);
            const wireMat = new THREE.MeshBasicMaterial({
                color: 0x00ff66,
                wireframe: true,
                transparent: true,
                opacity: 0.08
            });
            const wireSphere = new THREE.Mesh(wireGeo, wireMat);
            earthGroup.add(wireSphere);

            // Orbiting Satellite Model
            const satelliteGroup = new THREE.Group();
            const satMat = new THREE.MeshStandardMaterial({
                color: 0x00ff66,
                metalness: 0.8,
                roughness: 0.2,
                emissive: 0x001100
            });

            const satBody = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.11, 0.16), satMat);
            satelliteGroup.add(satBody);

            const panelMat = new THREE.MeshStandardMaterial({ color: 0x00cc55, metalness: 0.7 });
            const panelLeft = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.07, 0.01), panelMat);
            panelLeft.position.x = -0.22;
            const panelRight = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.07, 0.01), panelMat);
            panelRight.position.x = 0.22;
            satelliteGroup.add(panelLeft);
            satelliteGroup.add(panelRight);

            const dishGeo = new THREE.ConeGeometry(0.07, 0.04, 16);
            const dish = new THREE.Mesh(dishGeo, satMat);
            dish.rotation.x = -Math.PI / 2;
            dish.position.z = 0.10;
            satelliteGroup.add(dish);

            scene.add(satelliteGroup);

            // Satellite Orbit Path (Radius: 2.1)
            const orbitCurve = new THREE.EllipseCurve(0, 0, 2.1, 2.1, 0, 2 * Math.PI, false, 0);
            const points = orbitCurve.getPoints(120);
            const orbitGeo = new THREE.BufferGeometry().setFromPoints(points);
            const orbitMat = new THREE.LineBasicMaterial({ color: 0x00ff66, transparent: true, opacity: 0.25 });
            const orbitLine = new THREE.Line(orbitGeo, orbitMat);
            orbitLine.rotation.x = Math.PI / 2.2;
            orbitLine.rotation.y = (23.5 * Math.PI) / 180;
            scene.add(orbitLine);

            let angle = 0;
            function animate() {
                requestAnimationFrame(animate);

                earth.rotation.y += 0.002;
                wireSphere.rotation.y += 0.002;

                angle += 0.008;
                const radius = 2.1;
                satelliteGroup.position.x = Math.cos(angle) * radius;
                satelliteGroup.position.z = Math.sin(angle) * radius;
                satelliteGroup.position.y = Math.sin(angle) * 0.55;
                satelliteGroup.lookAt(earthGroup.position);

                renderer.render(scene, camera);
            }

            animate();

            window.addEventListener('resize', () => {
                const width = container.clientWidth;
                const height = container.clientHeight;
                renderer.setSize(width, height);
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
            });
        });
    </script>
</body>
</html>
